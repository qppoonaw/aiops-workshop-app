<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIOps Workshop — Items</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { margin-bottom: 0.25rem; }
      .sub { color: #666; margin-top: 0; }
      form { display: grid; gap: 0.5rem; margin: 1rem 0; }
      input, button { padding: 0.5rem; font-size: 1rem; }
      button { cursor: pointer; }
      #status { min-height: 1.25rem; font-size: 0.9rem; }
      .error { color: #c0392b; }
      .ok { color: #1e8449; }
      ul { padding-left: 1.25rem; }
      li { margin: 0.25rem 0; }
      code { background: rgba(127,127,127,0.15); padding: 0 0.25rem; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Items</h1>
    <p class="sub">AIOps Pipeline Workshop — 3-tier serverless demo</p>

    <p>
      API endpoint:
      <code id="api-endpoint">(set window.API_BASE_URL in config.js)</code>
    </p>

    <form id="create-form">
      <input id="name" placeholder="Item name" required />
      <input id="category" placeholder="Category" required />
      <input id="price" type="number" step="0.01" placeholder="Price" required />
      <button type="submit">Add item</button>
    </form>

    <div id="status"></div>

    <h2>Current items</h2>
    <button id="refresh">Refresh</button>
    <ul id="items"><li>Loading…</li></ul>

    <!-- config.js is generated at deploy time with the real API base URL -->
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
